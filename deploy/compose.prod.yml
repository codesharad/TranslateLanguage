services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - signaling

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: translate
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: translate
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U translate"]
      interval: 5s
      timeout: 3s
      retries: 20

  orchestrator:
    build: ../backend/orchestrator
    restart: unless-stopped
    environment:
      ORCHESTRATOR_HOST: 0.0.0.0
      ORCHESTRATOR_PORT: "8090"
      PIPELINE_PROVIDER: ${PIPELINE_PROVIDER:-mock}

  signaling:
    build: ../backend/signaling
    restart: unless-stopped
    environment:
      SIGNALING_PORT: "8080"
      DATABASE_URL: postgres://translate:${POSTGRES_PASSWORD}@postgres:5432/translate
      ORCHESTRATOR_WS_URL: ws://orchestrator:8090/v1/media
      JWT_SECRET: ${JWT_SECRET}
      OTP_TTL_SEC: "300"
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_VERIFY_SERVICE_SID: ${TWILIO_VERIFY_SERVICE_SID:-}
      PUBLIC_BASE_URL: https://${DOMAIN}
    depends_on:
      postgres:
        condition: service_healthy
      orchestrator:
        condition: service_started

volumes:
  pgdata:
  caddy_data:
  caddy_config:
