# Render Blueprint. Connect this GitHub repo in the Render dashboard and apply the blueprint.
# Free instances sleep and drop live calls. Starter stays awake.
databases:
  - name: translatelanguage-db
    databaseName: translate
    user: translate
    plan: basic-256mb
    region: singapore

services:
  - type: pserv
    name: translatelanguage-orchestrator
    runtime: docker
    region: singapore
    plan: starter
    dockerfilePath: ./backend/orchestrator/Dockerfile
    dockerContext: ./backend/orchestrator
    healthCheckPath: /health
    envVars:
      - key: PIPELINE_PROVIDER
        value: azure
      - key: AZURE_SPEECH_KEY
        sync: false
      - key: AZURE_SPEECH_REGION
        value: centralindia
      - key: AZURE_TRANSLATOR_KEY
        sync: false
      - key: AZURE_TRANSLATOR_REGION
        value: centralindia
      - key: AZURE_TRANSLATOR_ENDPOINT
        value: https://api.cognitive.microsofttranslator.com

  - type: web
    name: translatelanguage
    runtime: docker
    region: singapore
    plan: starter
    dockerfilePath: ./backend/signaling/Dockerfile
    dockerContext: ./backend/signaling
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: translatelanguage-db
          property: connectionString
      - key: DATABASE_SSL
        value: "true"
      - key: ORCHESTRATOR_HOSTPORT
        fromService:
          name: translatelanguage-orchestrator
          type: pserv
          property: hostport
      - key: JWT_SECRET
        generateValue: true
      - key: PUBLIC_BASE_URL
        value: https://translatelanguage.onrender.com
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_VERIFY_SERVICE_SID
        sync: false
