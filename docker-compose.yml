services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: translate
      POSTGRES_PASSWORD: translate
      POSTGRES_DB: translate
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U translate"]
      interval: 3s
      timeout: 3s
      retries: 20

  signaling:
    build: ./backend/signaling
    ports:
      - "8080:8080"
    environment:
      SIGNALING_PORT: "8080"
      DATABASE_URL: postgres://translate:translate@postgres:5432/translate
      ORCHESTRATOR_WS_URL: ws://orchestrator:8090/v1/media
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me}
      OTP_TTL_SEC: "300"
      APNS_KEY_PATH: ${APNS_KEY_PATH:-}
      APNS_KEY_ID: ${APNS_KEY_ID:-}
      APNS_TEAM_ID: ${APNS_TEAM_ID:-}
      APNS_BUNDLE_ID: ${APNS_BUNDLE_ID:-com.translatelanguage.app}
      FCM_PROJECT_ID: ${FCM_PROJECT_ID:-}
      FCM_CLIENT_EMAIL: ${FCM_CLIENT_EMAIL:-}
      FCM_PRIVATE_KEY: ${FCM_PRIVATE_KEY:-}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_VERIFY_SERVICE_SID: ${TWILIO_VERIFY_SERVICE_SID:-}
      TWILIO_FROM: ${TWILIO_FROM:-}
    depends_on:
      postgres:
        condition: service_healthy
      orchestrator:
        condition: service_started

  orchestrator:
    build: ./backend/orchestrator
    ports:
      - "8090:8090"
    environment:
      ORCHESTRATOR_HOST: 0.0.0.0
      ORCHESTRATOR_PORT: "8090"
      PIPELINE_PROVIDER: ${PIPELINE_PROVIDER:-mock}
      STT_PROVIDER: ${STT_PROVIDER:-}
      TRANSLATOR_PROVIDER: ${TRANSLATOR_PROVIDER:-}
      TTS_PROVIDER: ${TTS_PROVIDER:-}
      VAD_BACKEND: ${VAD_BACKEND:-silero}
      VAD_SILENCE_MS: ${VAD_SILENCE_MS:-180}
      TARGET_E2E_MS: "1000"
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-}
      GOOGLE_PROJECT_ID: ${GOOGLE_PROJECT_ID:-}
      AZURE_SPEECH_KEY: ${AZURE_SPEECH_KEY:-}
      AZURE_SPEECH_REGION: ${AZURE_SPEECH_REGION:-centralindia}
      AZURE_TRANSLATOR_KEY: ${AZURE_TRANSLATOR_KEY:-}
      AZURE_TRANSLATOR_REGION: ${AZURE_TRANSLATOR_REGION:-centralindia}
      SARVAM_API_KEY: ${SARVAM_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes:
      - ./secrets:/secrets:ro

  # Uncomment for production NAT traversal.
  # coturn:
  #   image: coturn/coturn:4.6
  #   network_mode: host
  #   command: ["-n", "--log-file=stdout", "--lt-cred-mech", "--user=turn:turn", "--realm=translatelanguage.local"]

volumes:
  pgdata:
